<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Souls PS1</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; outline: none; }
        #hint { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                color: #d8d0bf; font: 20px serif; pointer-events: none; }
    </style>
</head>
<body>
    <div id="hint">Chargement…</div>
    <canvas id="bevy" tabindex="0"></canvas>
    <script type="module">
        import init from "./souls.js";
        const hint = document.getElementById("hint");
        // Bevy fixe la taille du canvas au démarrage : on retire alors le message.
        new MutationObserver((_, obs) => { hint.remove(); obs.disconnect(); })
            .observe(document.getElementById("bevy"), { attributes: true, attributeFilter: ["width"] });
        init().catch((e) => {
            // Bevy remonte une exception de contrôle de flux au démarrage de sa boucle : normal.
            if (!String(e).includes("Using exceptions for control flow")) {
                hint.textContent = "Erreur : " + e;
                console.error(e);
            }
        });
    </script>
</body>
</html>
