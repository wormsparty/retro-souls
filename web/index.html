<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Giant's Flame</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; outline: none; }
        #hint { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                color: #d8d0bf; font: 20px serif; pointer-events: none; }
    </style>
</head>
<body>
    <div id="hint">Loading…</div>
    <canvas id="bevy" tabindex="0"></canvas>
    <script type="module">
        import init from "./giants-flame.js";
        const hint = document.getElementById("hint");
        // Bevy sets the canvas size on startup: remove the message then.
        new MutationObserver((_, obs) => { hint.remove(); obs.disconnect(); })
            .observe(document.getElementById("bevy"), { attributes: true, attributeFilter: ["width"] });
        init().catch((e) => {
            // Bevy throws a control-flow exception when its loop starts: expected.
            if (!String(e).includes("Using exceptions for control flow")) {
                hint.textContent = "Error: " + e;
                console.error(e);
            }
        });
    </script>
</body>
</html>
