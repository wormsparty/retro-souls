[package]
name = "giants-flame"
version = "0.1.0"
edition = "2024"
default-run = "giants-flame"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "default_platform",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "scene",
    "audio",
    "wav",
    "keyboard",
    "mouse",
    "gamepad",
    # Deterministic maths (glam via libm): essential for future rollback.
    "libm",
] }
serde = { version = "1", features = ["derive"] }
ron = "0.11"
serde_json = "1"
libm = "0.2"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element"] }

[features]
# `cargo run --features dev`: hot reload of assets/configs and dynamic linking (native only).
dev = ["bevy/file_watcher", "bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = true
lto = "fat"
panic = "abort"
